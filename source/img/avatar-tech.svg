<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Dark background -->
    <linearGradient id="avBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#060614"/>
      <stop offset="100%" stop-color="#0d0a28"/>
    </linearGradient>

    <!-- Cyan-to-purple border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00d4ff"/>
      <stop offset="50%"  stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="txtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="50%"  stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>

    <!-- Inner glow radial -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="70%"  stop-color="#7b2ff7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter -->
    <filter id="avGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow -->
    <filter id="avSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Hexagonal clip path (pointy-top, radius ~90) -->
    <clipPath id="hexClip">
      <polygon points="
        100,10
        183,55
        183,145
        100,190
        17,145
        17,55
      "/>
    </clipPath>
  </defs>

  <!-- ── Background fill ── -->
  <rect width="200" height="200" fill="url(#avBg)" rx="4"/>

  <!-- ── Hexagonal main area ── -->
  <!-- Outer glow ring -->
  <polygon
    points="100,6 187,53 187,147 100,194 13,147 13,53"
    fill="none"
    stroke="url(#borderGrad)"
    stroke-width="2.5"
    opacity="0.9"
    filter="url(#avGlow)"
  />

  <!-- Secondary ring -->
  <polygon
    points="100,12 181,57 181,143 100,188 19,143 19,57"
    fill="none"
    stroke="#00d4ff"
    stroke-width="0.5"
    opacity="0.4"
  />

  <!-- Clip interior -->
  <g clip-path="url(#hexClip)">
    <!-- Base fill -->
    <rect width="200" height="200" fill="url(#avBg)"/>

    <!-- Inner radial glow -->
    <ellipse cx="100" cy="100" rx="90" ry="90" fill="url(#innerGlow)"/>

    <!-- Grid inside hex -->
    <g opacity="0.08" stroke="#00d4ff" stroke-width="0.5">
      <line x1="0"   y1="40"  x2="200" y2="40"/>
      <line x1="0"   y1="70"  x2="200" y2="70"/>
      <line x1="0"   y1="100" x2="200" y2="100"/>
      <line x1="0"   y1="130" x2="200" y2="130"/>
      <line x1="0"   y1="160" x2="200" y2="160"/>
      <line x1="40"  y1="0"   x2="40"  y2="200"/>
      <line x1="70"  y1="0"   x2="70"  y2="200"/>
      <line x1="100" y1="0"   x2="100" y2="200"/>
      <line x1="130" y1="0"   x2="130" y2="200"/>
      <line x1="160" y1="0"   x2="160" y2="200"/>
    </g>

    <!-- Circuit traces -->
    <g opacity="0.25" stroke="#00d4ff" stroke-width="0.8" fill="none">
      <path d="M 30,100 L 60,100 L 60,70 L 80,70"/>
      <path d="M 170,100 L 140,100 L 140,130 L 120,130"/>
      <path d="M 100,30  L 100,60  L 120,60"/>
      <path d="M 100,170 L 100,140 L 80,140"/>
    </g>
    <!-- Circuit dots -->
    <g fill="#00d4ff" opacity="0.5">
      <circle cx="80"  cy="70"  r="2.5"/>
      <circle cx="120" cy="130" r="2.5"/>
      <circle cx="120" cy="60"  r="2.5"/>
      <circle cx="80"  cy="140" r="2.5"/>
    </g>

    <!-- Inner small hex ring -->
    <polygon
      points="100,42 134,61 134,99 100,118 66,99 66,61"
      fill="none"
      stroke="#7b2ff7"
      stroke-width="0.8"
      opacity="0.4"
    />

    <!-- Outer ring dots (orbit) -->
    <circle cx="100" cy="22"  r="2" fill="#00d4ff" opacity="0.7" filter="url(#avSoftGlow)"/>
    <circle cx="178" cy="65"  r="2" fill="#7b2ff7" opacity="0.7" filter="url(#avSoftGlow)"/>
    <circle cx="178" cy="135" r="2" fill="#00d4ff" opacity="0.7" filter="url(#avSoftGlow)"/>
    <circle cx="100" cy="178" r="2" fill="#7b2ff7" opacity="0.7" filter="url(#avSoftGlow)"/>
    <circle cx="22"  cy="135" r="2" fill="#00d4ff" opacity="0.7" filter="url(#avSoftGlow)"/>
    <circle cx="22"  cy="65"  r="2" fill="#7b2ff7" opacity="0.7" filter="url(#avSoftGlow)"/>
  </g>

  <!-- ── Main text "WYX" ── -->
  <text
    x="100" y="105"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Courier New', 'Consolas', monospace"
    font-size="44"
    font-weight="900"
    letter-spacing="3"
    fill="url(#txtGrad)"
    filter="url(#avGlow)"
  >WYX</text>

  <!-- Sub label -->
  <text
    x="100" y="134"
    text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="9"
    letter-spacing="5"
    fill="#00d4ff"
    opacity="0.65"
  >· LAB ·</text>

  <!-- ── Rotating glow dot animation (outer hex vertex) ── -->
  <!-- Top dot pulsing -->
  <circle cx="100" cy="6" r="3" fill="#00d4ff" filter="url(#avGlow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r"       values="2;4;2"     dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Scan line sweep -->
  <rect x="17" y="0" width="166" height="2" fill="url(#borderGrad)" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="0,-10" to="0,210" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.1;0.9;1" dur="3s" repeatCount="indefinite"/>
  </rect>

</svg>
