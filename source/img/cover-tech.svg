<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600">
  <defs>
    <!-- Deep space background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#04040f"/>
      <stop offset="45%"  stop-color="#080820"/>
      <stop offset="100%" stop-color="#0a0520"/>
    </linearGradient>

    <!-- Cyan glow for grid lines -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Strong glow for orbs -->
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Soft glow -->
    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Center radial glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0.18"/>
      <stop offset="50%"  stop-color="#7b2ff7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <!-- Title text gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="40%"  stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>

    <!-- Hex fill gradient -->
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Scan line gradient -->
    <linearGradient id="scanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="30%"  stop-color="#00d4ff" stop-opacity="0.7"/>
      <stop offset="70%"  stop-color="#7b2ff7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- Clip for overall frame -->
    <clipPath id="frameClip">
      <rect x="0" y="0" width="1400" height="600"/>
    </clipPath>
  </defs>

  <!-- ── Background ── -->
  <rect width="1400" height="600" fill="url(#bgGrad)"/>

  <!-- Center glow orb -->
  <ellipse cx="700" cy="300" rx="600" ry="320" fill="url(#centerGlow)"/>

  <!-- ── Perspective grid (bottom) ── -->
  <g opacity="0.18" filter="url(#glowCyan)">
    <!-- Horizontal perspective lines -->
    <line x1="0"    y1="600" x2="1400" y2="600" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="100"  y1="540" x2="1300" y2="540" stroke="#00d4ff" stroke-width="0.4"/>
    <line x1="200"  y1="480" x2="1200" y2="480" stroke="#00d4ff" stroke-width="0.35"/>
    <line x1="280"  y1="430" x2="1120" y2="430" stroke="#00d4ff" stroke-width="0.3"/>
    <line x1="340"  y1="390" x2="1060" y2="390" stroke="#00d4ff" stroke-width="0.25"/>
    <line x1="390"  y1="360" x2="1010" y2="360" stroke="#00d4ff" stroke-width="0.2"/>
    <!-- Vertical vanishing lines from center-bottom (700,700) -->
    <line x1="700" y1="700" x2="0"    y2="600" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="700" y1="700" x2="140"  y2="600" stroke="#00d4ff" stroke-width="0.4"/>
    <line x1="700" y1="700" x2="280"  y2="600" stroke="#00d4ff" stroke-width="0.4"/>
    <line x1="700" y1="700" x2="420"  y2="600" stroke="#00d4ff" stroke-width="0.4"/>
    <line x1="700" y1="700" x2="560"  y2="600" stroke="#00d4ff" stroke-width="0.4"/>
    <line x1="700" y1="700" x2="700"  y2="600" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="700" y1="700" x2="840"  y2="600" stroke="#00d4ff" stroke-width="0.4"/>
    <line x1="700" y1="700" x2="980"  y2="600" stroke="#00d4ff" stroke-width="0.4"/>
    <line x1="700" y1="700" x2="1120" y2="600" stroke="#00d4ff" stroke-width="0.4"/>
    <line x1="700" y1="700" x2="1260" y2="600" stroke="#00d4ff" stroke-width="0.4"/>
    <line x1="700" y1="700" x2="1400" y2="600" stroke="#00d4ff" stroke-width="0.5"/>
  </g>

  <!-- ── Flat grid top half ── -->
  <g opacity="0.06" stroke="#00d4ff" stroke-width="0.5">
    <!-- Vertical lines -->
    <line x1="100"  y1="0" x2="100"  y2="380"/>
    <line x1="200"  y1="0" x2="200"  y2="380"/>
    <line x1="300"  y1="0" x2="300"  y2="380"/>
    <line x1="400"  y1="0" x2="400"  y2="380"/>
    <line x1="500"  y1="0" x2="500"  y2="380"/>
    <line x1="600"  y1="0" x2="600"  y2="380"/>
    <line x1="700"  y1="0" x2="700"  y2="380"/>
    <line x1="800"  y1="0" x2="800"  y2="380"/>
    <line x1="900"  y1="0" x2="900"  y2="380"/>
    <line x1="1000" y1="0" x2="1000" y2="380"/>
    <line x1="1100" y1="0" x2="1100" y2="380"/>
    <line x1="1200" y1="0" x2="1200" y2="380"/>
    <line x1="1300" y1="0" x2="1300" y2="380"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="60"  x2="1400" y2="60"/>
    <line x1="0" y1="120" x2="1400" y2="120"/>
    <line x1="0" y1="180" x2="1400" y2="180"/>
    <line x1="0" y1="240" x2="1400" y2="240"/>
    <line x1="0" y1="300" x2="1400" y2="300"/>
    <line x1="0" y1="360" x2="1400" y2="360"/>
  </g>

  <!-- ── Hexagon circuit pattern (right side) ── -->
  <!-- Using flat-top hexagons, size 45 -->
  <g opacity="0.55" filter="url(#glowSoft)">
    <!-- hex helper: flat-top hex cx cy r  → points computed -->
    <!-- Row 1 -->
    <polygon points="1050,80 1085,60 1120,80 1120,120 1085,140 1050,120" fill="url(#hexFill)" stroke="#00d4ff" stroke-width="0.8"/>
    <polygon points="1120,80 1155,60 1190,80 1190,120 1155,140 1120,120" fill="url(#hexFill)" stroke="#7b2ff7" stroke-width="0.6"/>
    <polygon points="1190,80 1225,60 1260,80 1260,120 1225,140 1190,120" fill="url(#hexFill)" stroke="#00d4ff" stroke-width="0.8"/>
    <polygon points="1260,80 1295,60 1330,80 1330,120 1295,140 1260,120" fill="url(#hexFill)" stroke="#7b2ff7" stroke-width="0.6"/>
    <!-- Row 2 (offset) -->
    <polygon points="1085,140 1120,120 1155,140 1155,180 1120,200 1085,180" fill="url(#hexFill)" stroke="#7b2ff7" stroke-width="0.8"/>
    <polygon points="1155,140 1190,120 1225,140 1225,180 1190,200 1155,180" fill="url(#hexFill)" stroke="#00d4ff" stroke-width="0.6"/>
    <polygon points="1225,140 1260,120 1295,140 1295,180 1260,200 1225,180" fill="url(#hexFill)" stroke="#7b2ff7" stroke-width="0.8"/>
    <polygon points="1295,140 1330,120 1365,140 1365,180 1330,200 1295,180" fill="url(#hexFill)" stroke="#00d4ff" stroke-width="0.6"/>
    <!-- Row 3 -->
    <polygon points="1050,200 1085,180 1120,200 1120,240 1085,260 1050,240" fill="url(#hexFill)" stroke="#00d4ff" stroke-width="0.8"/>
    <polygon points="1120,200 1155,180 1190,200 1190,240 1155,260 1120,240" fill="url(#hexFill)" stroke="#7b2ff7" stroke-width="0.6"/>
    <polygon points="1190,200 1225,180 1260,200 1260,240 1225,260 1190,240" fill="none"         stroke="#00d4ff" stroke-width="1.2"/>
    <polygon points="1260,200 1295,180 1330,200 1330,240 1295,260 1260,240" fill="url(#hexFill)" stroke="#7b2ff7" stroke-width="0.6"/>
    <!-- Row 4 (offset) -->
    <polygon points="1085,260 1120,240 1155,260 1155,300 1120,320 1085,300" fill="url(#hexFill)" stroke="#7b2ff7" stroke-width="0.8"/>
    <polygon points="1155,260 1190,240 1225,260 1225,300 1190,320 1155,300" fill="url(#hexFill)" stroke="#00d4ff" stroke-width="0.6"/>
    <polygon points="1225,260 1260,240 1295,260 1295,300 1260,320 1225,300" fill="url(#hexFill)" stroke="#7b2ff7" stroke-width="0.8"/>
    <!-- Row 5 -->
    <polygon points="1050,320 1085,300 1120,320 1120,360 1085,380 1050,360" fill="url(#hexFill)" stroke="#00d4ff" stroke-width="0.6"/>
    <polygon points="1120,320 1155,300 1190,320 1190,360 1155,380 1120,360" fill="url(#hexFill)" stroke="#7b2ff7" stroke-width="0.8"/>
    <polygon points="1190,320 1225,300 1260,320 1260,360 1225,380 1190,360" fill="url(#hexFill)" stroke="#00d4ff" stroke-width="0.6"/>
  </g>

  <!-- Circuit connection lines (right) -->
  <g opacity="0.3" stroke="#00d4ff" stroke-width="0.8" fill="none">
    <path d="M1085,140 L1085,120"/>
    <path d="M1225,140 L1225,120"/>
    <path d="M1190,200 L1190,140"/>
    <path d="M1155,260 L1155,200"/>
    <path d="M1295,140 L1295,120"/>
    <circle cx="1085" cy="120" r="3" fill="#00d4ff"/>
    <circle cx="1225" cy="120" r="3" fill="#00d4ff"/>
    <circle cx="1190" cy="140" r="2" fill="#7b2ff7"/>
    <circle cx="1295" cy="120" r="3" fill="#00d4ff"/>
  </g>

  <!-- ── Hexagon circuit (left side, mirror) ── -->
  <g opacity="0.35" filter="url(#glowSoft)">
    <polygon points="80,160 115,140 150,160 150,200 115,220 80,200"   fill="url(#hexFill)" stroke="#7b2ff7" stroke-width="0.8"/>
    <polygon points="150,160 185,140 220,160 220,200 185,220 150,200" fill="url(#hexFill)" stroke="#00d4ff" stroke-width="0.6"/>
    <polygon points="115,220 150,200 185,220 185,260 150,280 115,260" fill="url(#hexFill)" stroke="#7b2ff7" stroke-width="0.8"/>
    <polygon points="185,220 220,200 255,220 255,260 220,280 185,260" fill="none"         stroke="#00d4ff" stroke-width="1"/>
    <polygon points="80,280  115,260 150,280 150,320 115,340 80,320"  fill="url(#hexFill)" stroke="#00d4ff" stroke-width="0.6"/>
    <polygon points="150,280 185,260 220,280 220,320 185,340 150,320" fill="url(#hexFill)" stroke="#7b2ff7" stroke-width="0.8"/>
  </g>

  <!-- ── Stars / dots scattered ── -->
  <g fill="white">
    <circle cx="50"   cy="40"  r="1.2" opacity="0.7"/>
    <circle cx="180"  cy="25"  r="0.8" opacity="0.5"/>
    <circle cx="330"  cy="55"  r="1.5" opacity="0.8"/>
    <circle cx="480"  cy="20"  r="0.7" opacity="0.4"/>
    <circle cx="620"  cy="45"  r="1.0" opacity="0.6"/>
    <circle cx="780"  cy="18"  r="1.3" opacity="0.7"/>
    <circle cx="920"  cy="38"  r="0.9" opacity="0.5"/>
    <circle cx="1070" cy="22"  r="1.2" opacity="0.6"/>
    <circle cx="1210" cy="48"  r="0.7" opacity="0.4"/>
    <circle cx="1370" cy="30"  r="1.1" opacity="0.6"/>
    <circle cx="60"   cy="420" r="0.9" opacity="0.4"/>
    <circle cx="240"  cy="400" r="1.0" opacity="0.5"/>
    <circle cx="450"  cy="440" r="0.7" opacity="0.3"/>
    <circle cx="960"  cy="410" r="1.1" opacity="0.5"/>
    <circle cx="1150" cy="435" r="0.8" opacity="0.4"/>
    <circle cx="1380" cy="415" r="1.0" opacity="0.5"/>
  </g>

  <!-- ── Floating orbs ── -->
  <circle cx="200" cy="150" r="4" fill="#00d4ff" opacity="0.6" filter="url(#glowStrong)"/>
  <circle cx="380" cy="90"  r="3" fill="#7b2ff7" opacity="0.8" filter="url(#glowStrong)"/>
  <circle cx="1100" cy="350" r="5" fill="#00d4ff" opacity="0.5" filter="url(#glowStrong)"/>
  <circle cx="1300" cy="120" r="3" fill="#7b2ff7" opacity="0.7" filter="url(#glowStrong)"/>

  <!-- ── Horizontal accent lines ── -->
  <line x1="0" y1="2"   x2="1400" y2="2"   stroke="url(#scanLine)" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="598" x2="1400" y2="598" stroke="url(#scanLine)" stroke-width="1.5" opacity="0.5"/>

  <!-- Left vertical accent -->
  <line x1="1" y1="0" x2="1" y2="600" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <line x1="1399" y1="0" x2="1399" y2="600" stroke="#7b2ff7" stroke-width="1" opacity="0.3"/>

  <!-- ── Data stream (diagonal lines, top-left corner) ── -->
  <g opacity="0.12" stroke="#00d4ff" stroke-width="0.6">
    <line x1="0"   y1="100" x2="120" y2="0"/>
    <line x1="0"   y1="160" x2="180" y2="0"/>
    <line x1="0"   y1="220" x2="220" y2="0"/>
    <line x1="0"   y1="280" x2="280" y2="0"/>
    <line x1="0"   y1="340" x2="340" y2="0"/>
  </g>

  <!-- ── Central title text ── -->
  <text
    x="700" y="260"
    text-anchor="middle"
    font-family="'Courier New', 'Consolas', monospace"
    font-size="96"
    font-weight="900"
    letter-spacing="18"
    fill="url(#titleGrad)"
    filter="url(#glowSoft)"
  >WYX LAB</text>

  <!-- Subtitle -->
  <text
    x="700" y="320"
    text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="16"
    font-weight="400"
    letter-spacing="8"
    fill="#00d4ff"
    opacity="0.7"
  >PERSONAL  BLOG  ·  WYXLAB.TOP</text>

  <!-- Decorative line under title -->
  <line x1="480" y1="338" x2="920" y2="338" stroke="url(#scanLine)" stroke-width="0.8" opacity="0.5"/>

  <!-- Small tag line -->
  <text
    x="700" y="370"
    text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="12"
    letter-spacing="4"
    fill="rgba(255,255,255,0.3)"
  >// 记录学习和生活的点滴</text>

  <!-- ── Corner brackets (frame deco) ── -->
  <!-- TL -->
  <path d="M20,20 L20,60 M20,20 L60,20" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- TR -->
  <path d="M1380,20 L1380,60 M1380,20 L1340,20" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- BL -->
  <path d="M20,580 L20,540 M20,580 L60,580" stroke="#7b2ff7" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- BR -->
  <path d="M1380,580 L1380,540 M1380,580 L1340,580" stroke="#7b2ff7" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- ── Scan line animation ── -->
  <rect x="0" y="0" width="1400" height="3" fill="url(#scanLine)" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="0,600" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite"/>
  </rect>

</svg>
