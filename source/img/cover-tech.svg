<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600">
  <defs>
    <!-- Bright sky gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#cfe9ff"/>
      <stop offset="50%"  stop-color="#eaf6ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Soft center glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%"   stop-color="#7cc4ff" stop-opacity="0.28"/>
      <stop offset="60%"  stop-color="#49b1f5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <!-- Title text gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1c3d5a"/>
      <stop offset="100%" stop-color="#49b1f5"/>
    </linearGradient>

    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#49b1f5"/>
      <stop offset="100%" stop-color="#8ec9ff"/>
    </linearGradient>

    <!-- Hex fill (light) -->
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#49b1f5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8ec9ff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="1400" height="600" fill="url(#bgGrad)"/>
  <ellipse cx="700" cy="240" rx="640" ry="300" fill="url(#centerGlow)"/>

  <!-- ── Dotted dot grid (very light) ── -->
  <g fill="#49b1f5">
    <circle cx="60"   cy="60"   r="2"   opacity="0.10"/>
    <circle cx="180"  cy="120"  r="1.5" opacity="0.08"/>
    <circle cx="320"  cy="50"   r="2"   opacity="0.10"/>
    <circle cx="500"  cy="110"  r="1.5" opacity="0.07"/>
    <circle cx="900"  cy="90"   r="2"   opacity="0.09"/>
    <circle cx="1050" cy="140"  r="1.5" opacity="0.08"/>
    <circle cx="1200" cy="60"   r="2"   opacity="0.10"/>
    <circle cx="1330" cy="120"  r="1.5" opacity="0.08"/>
    <circle cx="80"   cy="480"  r="1.5" opacity="0.08"/>
    <circle cx="220"  cy="520"  r="2"   opacity="0.09"/>
    <circle cx="1180" cy="500"  r="2"   opacity="0.09"/>
    <circle cx="1340" cy="470"  r="1.5" opacity="0.08"/>
  </g>

  <!-- ── Large decorative rings (right) ── -->
  <g fill="none" stroke="#49b1f5" opacity="0.16">
    <circle cx="1230" cy="180" r="110" stroke-width="1"/>
    <circle cx="1230" cy="180" r="150" stroke-width="0.6"/>
    <circle cx="1230" cy="180" r="190" stroke-width="0.4"/>
  </g>
  <circle cx="1230" cy="70" r="4" fill="#49b1f5" opacity="0.35"/>
  <circle cx="1230" cy="290" r="4" fill="#49b1f5" opacity="0.35"/>

  <!-- ── Hexagon outlines (left) ── -->
  <g fill="none" stroke="#49b1f5" opacity="0.18">
    <polygon points="170,420 215,395 260,420 260,470 215,495 170,470" stroke-width="1.2"/>
    <polygon points="215,470 260,445 305,470 305,520 260,545 215,520" stroke-width="0.8"/>
    <polygon points="260,520 305,495 350,520 350,570 305,595 260,570" stroke-width="0.6"/>
  </g>
  <circle cx="170" cy="395" r="3" fill="#49b1f5" opacity="0.4"/>
  <circle cx="260" cy="545" r="3" fill="#49b1f5" opacity="0.4"/>

  <!-- ── Small hexagons (right side) ── -->
  <g fill="url(#hexFill)" stroke="#49b1f5" opacity="0.55">
    <polygon points="1050,80 1085,60 1120,80 1120,120 1085,140 1050,120" stroke-width="0.8"/>
    <polygon points="1120,80 1155,60 1190,80 1190,120 1155,140 1120,120" stroke-width="0.6"/>
    <polygon points="1085,140 1120,120 1155,140 1155,180 1120,200 1085,180" stroke-width="0.8"/>
  </g>
  <g fill="none" stroke="#8ec9ff" opacity="0.5">
    <polygon points="1050,80 1085,60 1120,80 1120,120 1085,140 1050,120"/>
  </g>

  <!-- ── Floating orbs (soft blue) ── -->
  <circle cx="300" cy="180" r="5"  fill="#7cc4ff" opacity="0.55"/>
  <circle cx="470" cy="100" r="3"  fill="#49b1f5" opacity="0.45"/>
  <circle cx="560" cy="420" r="4"  fill="#7cc4ff" opacity="0.4"/>
  <circle cx="1020" cy="380" r="5" fill="#49b1f5" opacity="0.4"/>

  <!-- ── Horizontal accent lines ── -->
  <line x1="0" y1="0"   x2="1400" y2="0"   stroke="url(#accentGrad)" stroke-width="3" opacity="0.6"/>
  <line x1="0" y1="598" x2="1400" y2="598" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.3"/>

  <!-- ── Central title ── -->
  <text
    x="700" y="268"
    text-anchor="middle"
    font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
    font-size="92"
    font-weight="800"
    letter-spacing="14"
    fill="url(#titleGrad)"
  >WYX LAB</text>

  <!-- Decorative line under title -->
  <line x1="500" y1="310" x2="900" y2="310" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.55"/>

  <!-- Subtitle -->
  <text
    x="700" y="348"
    text-anchor="middle"
    font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
    font-size="17"
    font-weight="400"
    letter-spacing="6"
    fill="#5aa7e0"
    opacity="0.85"
  >记录学习和生活的点滴</text>

  <!-- Small tag line -->
  <text
    x="700" y="380"
    text-anchor="middle"
    font-family="'Consolas', 'Courier New', monospace"
    font-size="12"
    letter-spacing="4"
    fill="#9fbcd6"
  >WYXLAB.TOP · PERSONAL BLOG</text>

  <!-- ── Corner brackets (light blue) ── -->
  <g stroke="#49b1f5" stroke-width="2" fill="none" opacity="0.35">
    <path d="M24,24 L24,64 M24,24 L64,24"/>
    <path d="M1376,24 L1376,64 M1376,24 L1336,24"/>
    <path d="M24,576 L24,536 M24,576 L64,576"/>
    <path d="M1376,576 L1376,536 M1376,576 L1336,576"/>
  </g>

  <!-- ── Gentle scanning highlight ── -->
  <rect x="0" y="0" width="1400" height="2" fill="url(#accentGrad)" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="0,600" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0.35;0" keyTimes="0;0.05;0.95;1" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
