<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Soft blue gradient background -->
    <linearGradient id="avBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6fc0ff"/>
      <stop offset="55%"  stop-color="#49b1f5"/>
      <stop offset="100%" stop-color="#2f8fe0"/>
    </linearGradient>

    <!-- Light ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#d8efff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="txtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8efff"/>
    </linearGradient>

    <!-- Soft glow -->
    <filter id="avGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Rounded background ── -->
  <rect width="200" height="200" rx="48" fill="url(#avBg)"/>

  <!-- ── Decorative inner ring ── -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#ringGrad)" stroke-width="1.2" opacity="0.5"/>

  <!-- ── Subtle top light ── -->
  <ellipse cx="100" cy="70" rx="90" ry="60" fill="#ffffff" opacity="0.08"/>

  <!-- ── Decorative dots (orbit) ── -->
  <g fill="#ffffff">
    <circle cx="100" cy="20" r="2.5" opacity="0.7"/>
    <circle cx="180" cy="90" r="2"   opacity="0.5"/>
    <circle cx="100" cy="180" r="2.5" opacity="0.6"/>
    <circle cx="20"  cy="110" r="2"   opacity="0.5"/>
  </g>

  <!-- ── Main monogram ── -->
  <text
    x="100" y="108"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
    font-size="52"
    font-weight="800"
    letter-spacing="2"
    fill="url(#txtGrad)"
    filter="url(#avGlow)"
  >WYX</text>

  <!-- Sub label -->
  <text
    x="100" y="138"
    text-anchor="middle"
    font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
    font-size="11"
    font-weight="600"
    letter-spacing="6"
    fill="#ffffff"
    opacity="0.85"
  >LAB</text>

  <!-- ── Bottom accent bar ── -->
  <rect x="72" y="160" width="56" height="3" rx="1.5" fill="#ffffff" opacity="0.55"/>

  <!-- ── Gentle pulse on top dot ── -->
  <circle cx="100" cy="20" r="2.5" fill="#ffffff">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
